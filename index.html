<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="운동하면 티켓 1장, 라떼 한 잔에 티켓 1장. HR latte point">
<title>HR latte point</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%95%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EBEFE9; --surface:#FFFFFF; --ink:#2A1B14; --muted:#685A52; --line:#D3DAD1;
  --stub:#FFFBF4; --stub-edge:#C08A55; --latte:#C08A55; --espresso:#4A2E20;
  --accent:#2F4BFF; --accent-ink:#FFFFFF; --accent-soft:#E3E7FF;
  --earn:#1F7A4D; --spend:#8A4B22; --danger:#B3261E;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16120F; --surface:#211A16; --ink:#F2ECE6; --muted:#B5A9A0; --line:#3A302A;
    --stub:#2A221D; --stub-edge:#C9955F; --latte:#C9955F; --espresso:#6B4430;
    --accent:#8C9DFF; --accent-ink:#0E1440; --accent-soft:#272C4D;
    --earn:#6FD39E; --spend:#E3A574; --danger:#FF8A80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16120F; --surface:#211A16; --ink:#F2ECE6; --muted:#B5A9A0; --line:#3A302A;
  --stub:#2A221D; --stub-edge:#C9955F; --latte:#C9955F; --espresso:#6B4430;
  --accent:#8C9DFF; --accent-ink:#0E1440; --accent-soft:#272C4D;
  --earn:#6FD39E; --spend:#E3A574; --danger:#FF8A80;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.display{font-family:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400;letter-spacing:-0.01em}
main{max-width:780px;margin:0 auto;padding:20px 20px 72px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 8px}
.brand{font-size:1.35rem;margin:0}
.status{font-size:.82rem;color:var(--muted);margin:0;text-align:right}
.status.warn{color:var(--danger)}

/* hero */
.hero{padding:28px 0 32px;border-bottom:2px solid var(--ink)}
.count{margin:0;line-height:.92;font-size:clamp(4.6rem,20vw,9rem);font-variant-numeric:tabular-nums}
.count small{font-size:.3em;margin-left:.12em;color:var(--muted)}
.count.neg{color:var(--danger)}
.hero-lead{margin:14px 0 0;font-size:1.12rem;font-weight:700}
.stubs{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;min-height:40px;align-items:center}
.stub{width:62px;height:36px;position:relative;background:var(--stub);border:1.5px solid var(--stub-edge);border-radius:6px;
  display:grid;place-items:center;font-size:1rem}
.stub::before,.stub::after{content:"";position:absolute;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;
  background:var(--bg);border:1.5px solid var(--stub-edge)}
.stub::before{left:-7px;clip-path:inset(0 0 0 50%)}
.stub::after{right:-7px;clip-path:inset(0 50% 0 0)}
.stub.new{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.stub.new{animation:none}}
.stubs .more-count{font-size:.95rem;color:var(--muted);margin-left:4px}

/* panels */
.actions{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:28px}
@media (max-width:680px){.actions{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.panel h2{font-size:1.3rem;margin:0 0 14px}
.field{margin-bottom:14px}
.field>label,.field>.lbl{display:block;font-size:.88rem;font-weight:500;color:var(--muted);margin-bottom:6px}
input[type=date],input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:44px}
input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.kinds{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kinds input{position:absolute;opacity:0;pointer-events:none}
.kinds label{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 4px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;font-weight:500;margin:0}
.kinds label span{font-size:1.6rem;line-height:1.2}
.kinds label:hover{border-color:var(--ink)}
.kinds input:checked+label{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kinds input:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px}
.btn{width:100%;min-height:52px;border:none;border-radius:12px;font-weight:700;font-size:1.02rem;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.latte{background:var(--espresso);color:#FFF8EE}
.hint{font-size:.85rem;color:var(--muted);margin:8px 0 0;min-height:1.3em}
.hint.warn{color:var(--danger)}
.rule{font-size:.95rem;margin:-6px 0 16px;color:var(--muted)}
.cupart{display:grid;place-items:center;padding:6px 0 14px}
.cupart svg{width:84px;height:auto}

/* month */
.month{margin-top:36px}
.month h2,.history h2{font-size:1.3rem;margin:0 0 12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{padding:14px 10px;border-left:1px solid var(--line)}
.stats div:first-child{border-left:none;padding-left:0}
.stats dt{font-size:.82rem;color:var(--muted)}
.stats dd{margin:2px 0 0;font-size:1.45rem;font-variant-numeric:tabular-nums}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.stats div:nth-child(3){border-left:none;padding-left:0}.stats div:nth-child(n+3){border-top:1px solid var(--line)}}

/* history */
.history{margin-top:36px}
.list{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item .ico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:1rem;background:var(--accent-soft)}
.item.spend .ico{background:color-mix(in srgb,var(--latte) 25%,transparent)}
.item .what{min-width:0}
.item .what b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .what span{font-size:.82rem;color:var(--muted)}
.item .pts{font-weight:700;white-space:nowrap}
.item.earn .pts{color:var(--earn)}
.item.spend .pts{color:var(--spend)}
.del{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:8px;padding:4px 8px;font-size:.8rem;cursor:pointer;min-height:32px}
.del:hover{border-color:var(--line)}
.del.armed{color:var(--danger);border-color:var(--danger)}
.empty{padding:28px 0;color:var(--muted)}
.more{margin-top:12px;background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 16px;cursor:pointer}

/* data tools */
details.tools{margin-top:40px;border-top:2px solid var(--ink);padding-top:14px}
details.tools summary{cursor:pointer;font-weight:700;font-size:1.05rem;padding:6px 0}
.tools-body{padding-top:10px}
.tools-body p{font-size:.9rem;color:var(--muted);margin:0 0 14px;max-width:62ch}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btnrow button,.btnrow label{border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 14px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center}
.btnrow .danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 50%,transparent)}
.btnrow .primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.importbox{margin-top:14px;padding:14px;border:1px dashed var(--line);border-radius:12px}
.importbox p{color:var(--ink)}

.toast{position:fixed;left:50%;bottom:0;transform:translate(-50%,120%);padding-bottom:env(safe-area-inset-bottom,0px);
  transition:transform .25s ease;z-index:10;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast.show{transform:translate(-50%,-20px)}
.toast div{background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:500}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<main>
  <header class="top">
    <h1 class="brand display">HR latte point</h1>
    <p class="status" id="status" role="status">이 브라우저에 저장 중</p>
  </header>

  <section class="hero" aria-labelledby="cntLabel">
    <h2 class="sr" id="cntLabel">보유 티켓</h2>
    <p class="count display" id="count">0<small>장</small></p>
    <p class="hero-lead" id="heroLead">운동하고 첫 티켓을 받아 보세요</p>
    <div class="stubs" id="stubs" aria-hidden="true"></div>
  </section>

  <div class="actions">
    <section class="panel" aria-labelledby="earnTitle">
      <h2 id="earnTitle" class="display">운동 기록</h2>
      <p class="rule">운동 한 번에 티켓 1장</p>
      <form id="earnForm" novalidate>
        <div class="field">
          <span class="lbl" id="kindLbl">운동 종류</span>
          <div class="kinds" role="radiogroup" aria-labelledby="kindLbl" id="kinds"></div>
        </div>
        <div class="field">
          <label for="date">날짜</label>
          <input type="date" id="date">
        </div>
        <div class="field">
          <label for="earnNote">메모 (선택)</label>
          <input type="text" id="earnNote" maxlength="60" placeholder="예: 저녁 PT 하체">
        </div>
        <button class="btn" type="submit" id="earnBtn">티켓 1장 받기</button>
        <p class="hint" id="earnHint" aria-live="polite"></p>
      </form>
    </section>

    <section class="panel" aria-labelledby="spendTitle">
      <h2 id="spendTitle" class="display">라떼 마시기</h2>
      <p class="rule">라떼 한 잔에 티켓 1장</p>
      <div class="cupart" aria-hidden="true">
        <svg viewBox="0 0 80 96"><path d="M8 10h64l-6.5 74a6 6 0 0 1-6 5.5H20.5a6 6 0 0 1-6-5.5Z" fill="var(--latte)" stroke="var(--espresso)" stroke-width="3" stroke-linejoin="round"/><path d="M9 10h62l-.9 10H9.9Z" fill="var(--stub)"/><path d="M4 10h72" stroke="var(--espresso)" stroke-width="4" stroke-linecap="round"/></svg>
      </div>
      <form id="spendForm" novalidate>
        <div class="field">
          <label for="spendNote">카페 (선택)</label>
          <input type="text" id="spendNote" maxlength="40" placeholder="예: 학교 앞 카페">
        </div>
        <button class="btn latte" type="submit" id="spendBtn" disabled>티켓 1장 쓰고 라떼 마시기</button>
        <p class="hint" id="spendHint" aria-live="polite"></p>
      </form>
    </section>
  </div>

  <section class="month" aria-labelledby="monthTitle">
    <h2 id="monthTitle" class="display">이번 달</h2>
    <dl class="stats" id="stats"></dl>
  </section>

  <section class="history" aria-labelledby="histTitle">
    <h2 id="histTitle" class="display">기록</h2>
    <ul class="list" id="list"></ul>
    <button class="more" id="moreBtn" type="button" hidden>더 보기</button>
  </section>

  <details class="tools">
    <summary>백업과 데이터 관리</summary>
    <div class="tools-body">
      <p>기록은 지금 쓰는 브라우저에만 저장됩니다. 서버로 전송되지 않으므로, 브라우저 데이터를 지우거나 기기를 바꾸면 기록이 사라집니다. 백업 파일을 내려받아 두었다가 새 기기에서 불러오세요.</p>
      <div class="btnrow">
        <button type="button" class="primary" id="backupBtn">백업 파일 내려받기</button>
        <label for="importFile">백업 파일 불러오기</label>
        <input type="file" id="importFile" accept=".json,application/json" class="sr">
        <button type="button" id="csvBtn">CSV로 내보내기</button>
        <button type="button" class="danger" id="resetBtn">모든 기록 지우기</button>
      </div>
      <div class="importbox" id="importBox" hidden>
        <p id="importMsg"></p>
        <div class="btnrow">
          <button type="button" class="primary" id="importYes">불러온 기록으로 바꾸기</button>
          <button type="button" id="importNo">취소</button>
        </div>
      </div>
    </div>
  </details>
</main>

<div class="toast" id="toast" aria-live="polite"><div id="toastMsg"></div></div>

<script>
(function(){
'use strict';

/* ===== 운동 종류: 여기만 고치면 종류를 바꿀 수 있습니다 ===== */
const ACTIVITIES = [
  { id: 'walk',    name: '걷기',     icon: '🚶' },
  { id: 'pilates', name: '필라테스', icon: '🧘' },
  { id: 'pt',      name: '피티',     icon: '🏋️' }
];
const LS_KEY = 'hr-latte-point.tickets.v1';
const PAGE = 30;

const $ = id => document.getElementById(id);
const actById = Object.fromEntries(ACTIVITIES.map(a => [a.id, a]));

let state = { version: 1, entries: [] };
let shown = PAGE;
let storageOk = true;
let lastCount = null;
let pendingImport = null;

/* ----- 날짜: 항상 로컬 시간 기준 (UTC 사용 금지) ----- */
function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function todayStr(){ return ymd(new Date()); }
function parseYmd(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
const DOW = ['일','월','화','수','목','금','토'];
function prettyDate(s){
  if(s === todayStr()) return '오늘';
  const y = new Date(); y.setDate(y.getDate()-1);
  if(s === ymd(y)) return '어제';
  const d = parseYmd(s);
  const base = (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + DOW[d.getDay()] + ')';
  return d.getFullYear() === new Date().getFullYear() ? base : d.getFullYear() + '년 ' + base;
}

/* ----- 데이터 ----- */
function normalize(raw){
  const out = { version: 1, entries: [] };
  if(!raw || !Array.isArray(raw.entries)) return null;
  out.entries = raw.entries.filter(e => e && typeof e.id === 'string' &&
      /^\d{4}-\d{2}-\d{2}$/.test(e.date) &&
      ((e.type === 'earn' && actById[e.activity]) || e.type === 'spend'))
    .map(e => ({ id: e.id, type: e.type, date: e.date, ts: Number(e.ts) || 0,
      activity: e.type === 'earn' ? e.activity : undefined,
      note: typeof e.note === 'string' ? e.note.slice(0, 60) : '' }));
  return out;
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const n = normalize(JSON.parse(raw)); if(n) state = n; }
  }catch(e){ storageOk = false; }
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); storageOk = true; }
  catch(e){ storageOk = false; }
  setStatus();
}
function setStatus(){
  const el = $('status');
  el.textContent = storageOk ? '이 브라우저에 저장 중' : '저장할 수 없음: 새로고침하면 기록이 사라져요';
  el.classList.toggle('warn', !storageOk);
}
function tickets(){
  let n = 0;
  for(const e of state.entries) n += e.type === 'earn' ? 1 : -1;
  return n;
}
function sorted(){
  return [...state.entries].sort((a,b) => a.date === b.date ? b.ts - a.ts : (a.date < b.date ? 1 : -1));
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* ----- 화면 구성 ----- */
function build(){
  $('kinds').innerHTML = ACTIVITIES.map((a,i) =>
    `<input type="radio" name="kind" id="k-${a.id}" value="${a.id}" ${i===0?'checked':''}>` +
    `<label for="k-${a.id}"><span aria-hidden="true">${a.icon}</span>${a.name}</label>`).join('');
  $('date').value = todayStr();
  $('date').max = todayStr();

  $('kinds').addEventListener('change', checkEarn);
  $('date').addEventListener('input', checkEarn);
  $('earnForm').addEventListener('submit', onEarn);
  $('spendForm').addEventListener('submit', onSpend);
  $('list').addEventListener('click', onListClick);
  $('moreBtn').onclick = () => { shown += PAGE; renderList(); };
  $('backupBtn').onclick = exportJson;
  $('csvBtn').onclick = exportCsv;
  $('importFile').addEventListener('change', onImportFile);
  $('importYes').onclick = applyImport;
  $('importNo').onclick = cancelImport;
  $('resetBtn').onclick = armReset;
}

function selectedKind(){ return (document.querySelector('input[name=kind]:checked') || {}).value; }

function checkEarn(){
  const date = $('date').value, kind = selectedKind();
  let msg = '', ok = true;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ ok = false; msg = '날짜를 선택하세요.'; }
  else if(date > todayStr()){ ok = false; msg = '미래 날짜에는 기록할 수 없어요.'; }
  else if(!actById[kind]){ ok = false; msg = '운동 종류를 선택하세요.'; }
  else if(state.entries.some(e => e.type === 'earn' && e.date === date && e.activity === kind)){
    msg = prettyDate(date) + ' ' + actById[kind].name + ' 기록이 이미 있어요. 한 번 더 했다면 그대로 받으세요.';
  }
  $('earnHint').textContent = msg;
  $('earnHint').className = 'hint' + (msg ? ' warn' : '');
  $('earnBtn').disabled = !ok;
  return ok;
}

function onEarn(ev){
  ev.preventDefault();
  if(!checkEarn()) return;
  const kind = selectedKind();
  state.entries.push({ id: uid(), type: 'earn', date: $('date').value, ts: Date.now(),
    activity: kind, note: $('earnNote').value.trim() });
  save();
  $('earnNote').value = '';
  render();
  toast(actById[kind].name + ' 완료, 티켓 1장을 받았어요');
}

function onSpend(ev){
  ev.preventDefault();
  if(tickets() < 1){ render(); return; }
  state.entries.push({ id: uid(), type: 'spend', date: todayStr(), ts: Date.now(), note: $('spendNote').value.trim() });
  save();
  $('spendNote').value = '';
  render();
  toast('티켓 1장을 쓰고 라떼를 마셨어요');
}

/* 삭제: 두 번 눌러 확인 */
let armedId = null, armedTimer = null;
function onListClick(e){
  const b = e.target.closest('.del'); if(!b) return;
  const id = b.dataset.id;
  if(armedId !== id){
    armedId = id; clearTimeout(armedTimer);
    armedTimer = setTimeout(() => { armedId = null; renderList(); }, 3500);
    renderList(); return;
  }
  armedId = null; clearTimeout(armedTimer);
  const entry = state.entries.find(x => x.id === id); if(!entry) return;
  if(entry.type === 'earn' && tickets() - 1 < 0){
    toast('이 기록을 지우면 티켓이 마이너스가 돼요. 라떼 기록을 먼저 지우세요.');
    renderList(); return;
  }
  state.entries = state.entries.filter(x => x.id !== id);
  save(); render();
  toast('기록을 삭제했어요');
}

/* ----- 백업 ----- */
function download(filename, text, type){
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportJson(){
  download('hr-latte-point-backup-' + todayStr() + '.json', JSON.stringify(state, null, 2), 'application/json');
}
function exportCsv(){
  const esc = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const rows = [['날짜','구분','운동 종류','티켓','메모']];
  for(const e of sorted()){
    rows.push([e.date, e.type === 'earn' ? '적립' : '사용', e.type === 'earn' ? actById[e.activity].name : '라떼',
      e.type === 'earn' ? 1 : -1, e.note]);
  }
  download('hr-latte-point-' + todayStr() + '.csv', '\uFEFF' + rows.map(r => r.map(esc).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
}
function onImportFile(ev){
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data = null;
    try{ data = normalize(JSON.parse(reader.result)); }catch(e){}
    if(!data){ toast('HR latte point 백업 파일이 아니에요. 파일을 확인하세요.'); return; }
    const bal = data.entries.reduce((n,e) => n + (e.type === 'earn' ? 1 : -1), 0);
    if(bal < 0){ toast('백업 파일의 티켓 수가 마이너스예요. 다른 파일을 선택하세요.'); return; }
    pendingImport = data;
    $('importMsg').textContent = '현재 기록 ' + state.entries.length + '건을 백업 파일의 기록 ' + data.entries.length +
      '건(티켓 ' + bal + '장)으로 바꿉니다. 현재 기록은 사라집니다.';
    $('importBox').hidden = false;
  };
  reader.onerror = () => toast('파일을 읽지 못했어요.');
  reader.readAsText(file);
}
function applyImport(){
  if(!pendingImport) return;
  state = pendingImport; pendingImport = null;
  $('importBox').hidden = true;
  save(); shown = PAGE; render();
  toast('백업을 불러왔어요');
}
function cancelImport(){ pendingImport = null; $('importBox').hidden = true; }

let resetArmed = false, resetTimer = null;
function armReset(){
  const b = $('resetBtn');
  if(!resetArmed){
    resetArmed = true; b.textContent = '한 번 더 누르면 모두 지워져요';
    resetTimer = setTimeout(() => { resetArmed = false; b.textContent = '모든 기록 지우기'; }, 4000);
    return;
  }
  clearTimeout(resetTimer); resetArmed = false; b.textContent = '모든 기록 지우기';
  state.entries = [];
  save(); render();
  toast('모든 기록을 지웠어요');
}

/* ----- 렌더링 ----- */
function render(){
  const n = tickets();
  const c = $('count');
  c.innerHTML = (n < 0 ? '−' : '') + Math.abs(n).toLocaleString('ko-KR') + '<small>장</small>';
  c.classList.toggle('neg', n < 0);

  if(n > 0) $('heroLead').textContent = '지금 라떼 ' + n + '잔을 마실 수 있어요';
  else if(state.entries.length === 0) $('heroLead').textContent = '운동하고 첫 티켓을 받아 보세요';
  else $('heroLead').textContent = '티켓을 다 썼어요. 운동하면 다시 받을 수 있어요';

  const showN = Math.max(0, Math.min(n, 12));
  const grew = lastCount !== null && n > lastCount;
  $('stubs').innerHTML = Array.from({ length: showN }, (_, i) =>
    `<span class="stub${grew && i === showN - 1 ? ' new' : ''}">☕</span>`).join('') +
    (n > 12 ? `<span class="more-count">+${n - 12}장</span>` : '');
  lastCount = n;

  $('spendBtn').disabled = n < 1;
  $('spendHint').textContent = n < 1 ? '티켓이 없어요. 운동을 기록하면 받을 수 있어요.' : '';

  renderMonth();
  renderList();
  checkEarn();
}

function renderMonth(){
  const ym = todayStr().slice(0, 7);
  const cnt = Object.fromEntries(ACTIVITIES.map(a => [a.id, 0]));
  let lattes = 0;
  for(const e of state.entries){
    if(e.date.slice(0, 7) !== ym) continue;
    if(e.type === 'earn') cnt[e.activity]++;
    else lattes++;
  }
  $('stats').innerHTML = ACTIVITIES.map(a => `<div><dt>${a.name}</dt><dd class="display">${cnt[a.id]}회</dd></div>`).join('') +
    `<div><dt>마신 라떼</dt><dd class="display">${lattes}잔</dd></div>`;
}

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderList(){
  const all = sorted();
  if(all.length === 0){
    $('list').innerHTML = '<li class="empty">아직 기록이 없어요. 오늘 한 운동을 기록하면 여기에 쌓여요.</li>';
    $('moreBtn').hidden = true; return;
  }
  $('list').innerHTML = all.slice(0, shown).map(e => {
    const earn = e.type === 'earn';
    const a = earn ? actById[e.activity] : null;
    const title = earn ? a.name : '라떼 한 잔';
    const meta = prettyDate(e.date) + (e.note ? ', ' + e.note : '');
    const armed = armedId === e.id;
    return `<li class="item ${e.type}">
      <span class="ico" aria-hidden="true">${earn ? a.icon : '☕'}</span>
      <span class="what"><b>${esc(title)}</b><span>${esc(meta)}</span></span>
      <span class="pts">${earn ? '+1장' : '−1장'}</span>
      <button type="button" class="del${armed ? ' armed' : ''}" data-id="${esc(e.id)}" aria-label="${esc(title)} 기록 삭제">${armed ? '정말 삭제' : '삭제'}</button>
    </li>`;
  }).join('');
  $('moreBtn').hidden = all.length <= shown;
}

let toastTimer = null;
function toast(msg){
  $('toastMsg').textContent = msg;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 2600);
}

/* 다른 탭에서 바뀐 기록 반영 */
window.addEventListener('storage', e => {
  if(e.key !== LS_KEY) return;
  load(); render();
});

load();
build();
setStatus();
render();
})();
</script>
</body>
